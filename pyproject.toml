[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "minici-local"
version = "1.0.0"
description = "A lightweight, local-first CI/CD runner."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "junjie-xu-lab" }]
keywords = ["ci", "cd", "automation", "pipeline", "local"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "fastapi>=0.115,<1",
  "filelock>=3.16,<4",
  "jinja2>=3.1,<4",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
  "watchfiles>=1.0,<2",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]
release = ["pyinstaller>=6.10,<7"]

[project.scripts]
minici = "minici.cli.app:app"

[project.urls]
Homepage = "https://github.com/junjie-xu-lab/MiniCI"
Issues = "https://github.com/junjie-xu-lab/MiniCI/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/minici"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/packaging",
  "/.github",
  "/pyproject.toml",
  "/requirements.txt",
  "/README.md",
  "/LICENSE",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
  "/CHANGELOG.md",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["minici"]
omit = ["src/minici/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
